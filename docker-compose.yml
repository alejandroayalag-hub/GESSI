services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gessi
      POSTGRES_USER: gessi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    ports:
      # ponytail: solo localhost — el backend corre en el mismo host. Cierra Postgres a internet.
      - "127.0.0.1:5447:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
